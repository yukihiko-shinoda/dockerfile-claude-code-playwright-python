services:
  claude-code-playwright-python:
    build:
      args:
        # - Microsoft Artifact Registry
        #   https://mcr.microsoft.com/en-us/artifact/mar/playwright/python/tags
        DOCKER_IMAGE_TAG_PLAYWRIGHT: v1.65.2-resolute
        # - uv · PyPI
        #   https://pypi.org/project/uv/#history
        VERSION_UV: 0.13.7
        # - @anthropic-ai/claude-code - npm
        #   https://www.npmjs.com/package/@anthropic-ai/claude-code?activeTab=versions
        VERSION_CLAUDE_CODE: 2.1.311
        # - Commits · yukihiko-shinoda/claude-code-settings-file
        #   https://github.com/yukihiko-shinoda/claude-code-settings-file/commits/main/
        VERSION_MANAGED_SETTINGS_JSON: ca5f37a52c0321e076c9db16abe8fcf383b7f032
      context: .
    entrypoint:
      - /bin/bash
    image: futureys/claude-code-playwright-python:development
    user: root
    volumes:
      - .:/workspace
      - /workspace/.venv
      - /workspace/.cache/ms-playwright
      # - Using uv in Docker | uv
      #   https://docs.astral.sh/uv/guides/integration/docker/#caching
      - uv-cache:/root/.cache/uv
volumes:
  uv-cache:
